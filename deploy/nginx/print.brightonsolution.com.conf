# PrintDesk – nginx site for print.brightonsolution.com (+ adminprint.brightonsolution.com)
#
#   sudo cp deploy/nginx/print.brightonsolution.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/print.brightonsolution.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d print.brightonsolution.com -d adminprint.brightonsolution.com
#
# This file only listens on port 80 and only answers for these two host names, so
# other sites on the server are not affected. certbot --nginx adds the HTTPS (443)
# server and the HTTP -> HTTPS redirect, and renews the certificate automatically.
# The Node app (pm2 "printdesk") listens on 127.0.0.1:3100 – if you use another
# PORT in .env, change both proxy_pass lines below.
# The admin host is recognised by the app itself (ADMIN_HOST in .env).

server {
    listen 80;
    listen [::]:80;
    server_name print.brightonsolution.com adminprint.brightonsolution.com;

    server_tokens off;

    # Customer uploads: up to 5 files x 100 MB per order, on slow mobile networks.
    client_max_body_size 520M;
    # Max gap between two reads of the body (not the total upload time).
    client_body_timeout 120s;
    send_timeout 3600s;

    # Proxy settings shared by every location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Stream uploads straight to Node (it checks size, type and CSRF as they arrive).
    proxy_request_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Static files: compressed here (Node already sets the cache headers).
    location ~ ^/(css|js|icons|fonts|brand)/|^/(sw\.js|manifest\.webmanifest|offline\.html|robots\.txt)$ {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 512;
        gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;
        proxy_pass http://127.0.0.1:3100;
    }

    # Pages, uploads and downloads. Pages carry CSRF tokens, so they are not
    # gzip-compressed (avoids BREACH-style attacks over HTTPS).
    location / {
        gzip off;
        proxy_pass http://127.0.0.1:3100;
    }
}
